services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrant_data:/qdrant/storage"]

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: "${DOCKER_DATABASE_URL:-postgresql+asyncpg://username:password@host.docker.internal:5432/database_name}"
      REDIS_URL: redis://redis:6379/0
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    depends_on:
      redis: {condition: service_healthy}

volumes:
  qdrant_data:
